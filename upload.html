{% extends 'base.html' %}
{% block title %}Excel Import — Attendance Management System{% endblock %}
{% block content %}

<h2 class="panel-title">Import Students from Excel</h2>

<section class="panel form-panel">
    <form method="post" enctype="multipart/form-data">
    {{ csrf_input() }}
        <div class="field">
            <label>Select Excel File <span class="req">*</span></label>
            <input type="file" name="file" accept=".xlsx,.xls" required>
        </div>
        <div class="field-actions">
            <button type="submit" class="btn btn-ink">Import</button>
        </div>
    </form>
</section>

{% endblock %}
